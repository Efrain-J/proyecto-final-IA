[project]
name = "trabajo-final"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "markitdown[pdf]>=0.1.9",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["network: tests that call real external services"]
addopts = "-m 'not network'"
